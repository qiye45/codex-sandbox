name: Build Single Codex Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Codex version to build (e.g., 0.38.0, default latest)'
        required: false
        default: latest
        type: string
      push_image:
        description: 'Push image to GHCR'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Dry run - check what would be built without actually building'
        required: false
        default: false
        type: boolean

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: qiye45/codex-sandbox

jobs:
  build-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v5

      - name: Resolve execution mode
        id: mode
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PUSH_IMAGE: ${{ inputs.push_image }}
        run: |
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            echo "effective_dry_run=true" >> "$GITHUB_OUTPUT"
            echo "effective_push=false" >> "$GITHUB_OUTPUT"
            echo "📝 Dry run requested"
          elif [ "$INPUT_PUSH_IMAGE" = "true" ]; then
            echo "effective_dry_run=false" >> "$GITHUB_OUTPUT"
            echo "effective_push=true" >> "$GITHUB_OUTPUT"
            echo "🚀 Push mode enabled"
          else
            echo "effective_dry_run=false" >> "$GITHUB_OUTPUT"
            echo "effective_push=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ Build-only mode (no push)"
          fi

      - name: Login to GHCR
        if: ${{ steps.mode.outputs.effective_push == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build single version
        run: |
          #!/bin/bash
          set -e
          
          version="${{ inputs.version }}"
          platforms="linux/amd64,linux/arm64"
          dry_run="${{ steps.mode.outputs.effective_dry_run }}"
          should_push="${{ steps.mode.outputs.effective_push }}"
          image_name="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${version}"
          latest_image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          
          echo "🔍 Processing version: ${version}"
          echo "🔧 Dry run mode: ${dry_run}"
          echo ""
          
          echo "🔍 Checking if ${image_name} exists..."
          if [ -z "$(DOCKER_CLI_EXPERIMENTAL=enabled docker manifest inspect "$image_name" 2> /dev/null)" ]; then
            if [ "$dry_run" = "true" ]; then
              echo "📝 [DRY RUN] Would build ${image_name}"
              echo "✅ Dry run completed for version ${version}"
            else
              if [ "$should_push" = "true" ]; then
                echo "🚀 Building and pushing ${image_name}..."
                docker buildx build \
                  --platform "$platforms" \
                  --build-arg "CODEX_VERSION=${version}" \
                  -t "$image_name" --push .
                if [ "$version" = "latest" ]; then
                  echo "✅ Successfully built and pushed ${image_name}"
                else
                  docker buildx build \
                    --platform "$platforms" \
                    --build-arg "CODEX_VERSION=${version}" \
                    -t "$latest_image" --push .
                  echo "✅ Successfully built and pushed ${image_name} and ${latest_image}"
                fi
              else
                echo "🚀 Building ${image_name} locally (no push)..."
                docker buildx build \
                  --build-arg "CODEX_VERSION=${version}" \
                  -t "$image_name" --load .
                echo "✅ Successfully built ${image_name} (local only)"
              fi
            fi
          else
            echo "⏭️  ${image_name} already exists, skipping..."
            echo "✅ Version ${version} already available"
          fi
          
          echo ""
          echo "🎉 Processing complete for version ${version}!"
